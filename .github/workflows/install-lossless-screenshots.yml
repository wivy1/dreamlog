name: install lossless screenshots

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  install:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: check out pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: restore full-resolution png screenshots
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .github/screenshot-parts/part-aa \
            .github/screenshot-parts/part-ab \
            > /tmp/dreamlog-screenshots.tar.xz

          xz -t /tmp/dreamlog-screenshots.tar.xz
          rm -rf /tmp/dreamlog-screenshots
          mkdir -p /tmp/dreamlog-screenshots

          if tar -tJf /tmp/dreamlog-screenshots.tar.xz >/dev/null 2>&1; then
            tar -xJf /tmp/dreamlog-screenshots.tar.xz -C /tmp/dreamlog-screenshots
          else
            xz -dc /tmp/dreamlog-screenshots.tar.xz > /tmp/dreamlog-screenshot-payload
            payload_type="$(file -b --mime-type /tmp/dreamlog-screenshot-payload)"
            case "$payload_type" in
              application/x-tar)
                tar -xf /tmp/dreamlog-screenshot-payload -C /tmp/dreamlog-screenshots
                ;;
              application/zip)
                unzip -q /tmp/dreamlog-screenshot-payload -d /tmp/dreamlog-screenshots
                ;;
              image/png)
                cp /tmp/dreamlog-screenshot-payload /tmp/dreamlog-screenshots/start-night.png
                ;;
              *)
                echo "unsupported restored payload: $payload_type" >&2
                file /tmp/dreamlog-screenshot-payload >&2
                exit 1
                ;;
            esac
          fi

          find /tmp/dreamlog-screenshots -type f -print
          mkdir -p docs/images

          copy_screenshot() {
            destination="$1"
            shift
            source=""
            for candidate in "$@"; do
              source="$(find /tmp/dreamlog-screenshots -type f -name "$candidate" -print -quit)"
              if [[ -n "$source" ]]; then
                break
              fi
            done
            if [[ -z "$source" ]]; then
              echo "missing source for $destination" >&2
              exit 1
            fi
            cp "$source" "$destination"
          }

          copy_screenshot docs/images/01-ready-to-start.png \
            01-ready-to-start.png start-night.png
          copy_screenshot docs/images/02-local-models.png \
            02-local-models.png local-models.png
          copy_screenshot docs/images/03-enriching-dreams.png \
            03-enriching-dreams.png enriching-dreams.png
          copy_screenshot docs/images/04-enriched-dream.png \
            04-enriched-dream.png dream-detail.png enriched-dream.png

          python3 - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              Path("docs/images/01-ready-to-start.png"): (919, 1708),
              Path("docs/images/02-local-models.png"): (919, 1239),
              Path("docs/images/03-enriching-dreams.png"): (919, 1240),
              Path("docs/images/04-enriched-dream.png"): (919, 1542),
          }

          for path, dimensions in expected.items():
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path} is not a PNG")
              actual = struct.unpack(">II", data[16:24])
              if actual != dimensions:
                  raise SystemExit(
                      f"{path} has dimensions {actual}; expected {dimensions}"
                  )
              print(f"verified {path}: {actual[0]} x {actual[1]}, {len(data)} bytes")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          replacements = {
              "docs/images/01-ready-to-start.webp": "docs/images/01-ready-to-start.png",
              "docs/images/02-local-models.webp": "docs/images/02-local-models.png",
              "docs/images/03-enriching-dreams.webp": "docs/images/03-enriching-dreams.png",
              "docs/images/04-enriched-dream.webp": "docs/images/04-enriched-dream.png",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if ".webp" in text:
              raise SystemExit("README still contains a WebP reference")
          readme.write_text(text, encoding="utf-8")
          PY

          rm -f \
            docs/images/01-ready-to-start.webp \
            docs/images/02-local-models.webp \
            docs/images/03-enriching-dreams.webp \
            docs/images/04-enriched-dream.webp
          rm -rf .github/screenshot-parts
          rm -f .github/workflows/install-lossless-screenshots.yml

      - name: commit and push screenshots
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "use lossless png screenshots"
          git push origin "HEAD:${HEAD_BRANCH}"
